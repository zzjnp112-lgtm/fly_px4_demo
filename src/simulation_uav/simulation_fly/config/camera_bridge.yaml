# camer_bridge（gz-sim → ROS2）参数
# 节点名必须与 camer_bridge.cpp 里的 Node("gz_to_ros2_bridge") 一致
# gz-sim 里 x500_mid360 的自定义传感器 topic 是全局的（实测 gz topic -l）
gz_to_ros2_bridge:
  ros__parameters:
    # gz 全局 topic（来源）
    gz_rgb_topic: "/gemini2/rgb/image"          # 下视 gemini2 RGB
    gz_front_rgb_topic: "/front_cam/rgb/image"  # 前视 RGB
    gz_lidar_points_topic: "/mid360/scan/points"  # MID360 点云（PointCloudPacked）
    gz_lidar_imu_topic: "/mid360/imu"           # MID360 IMU

    # ROS2 输出 topic（需与下游 FAST-LIO / 视觉节点对齐）
    ros_rgb_topic: "/drone_0_/camera/image_raw"
    ros_front_rgb_topic: "/drone_0_/front_cam/image_raw"
    ros_lidar_points_topic: "/drone_0_/lidar/points"
    lidar_imu_topic: "lidar/imu/data"
